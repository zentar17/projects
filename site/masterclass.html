<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predage - Masterclass</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Anton&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #E67E22;
    --accent: #38BDF8;
    --bg-dark: #0a0a0f;
    --bg-card: rgba(24, 24, 32, 0.85);
    --bg-bar: #101016;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e8ed;
    --text-dim: #a3a3ad;
}

html {
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--primary) var(--bg-dark);
}

body {
    min-height: 100vh;
    background: var(--bg-dark);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    animation: pageFadeIn 0.4s ease;
}

body.page-fade-out {
    animation: pageFadeOut 0.22s ease forwards;
}

@keyframes pageFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes pageFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

::-webkit-scrollbar { width: 11px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb {
    background-color: var(--primary);
    border-radius: 999px;
    border: 3px solid var(--bg-dark);
    background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background-color: #d36a15; }

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    display: grid;
    grid-template-columns: 0.7fr 2.2fr 0.7fr;
    align-items: center;
    padding: 16px 48px;
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.header-spacer { height: 78px; }

.header-brand { display: flex; align-items: center; gap: 12px; }
header img.brand-logo { width: 44px; height: 44px; object-fit: contain; }
.header-brand span { font-weight: 800; font-size: 20px; letter-spacing: 0.3px; }

.header-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

.header-nav a {
    position: relative;
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
    transition: color 0.15s ease;
}

.header-nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0;
    height: 2px;
    background: var(--text);
    transition: width 0.25s ease;
}

.nav-dot {
    color: var(--text-dim);
    opacity: 0.4;
    font-size: 14px;
}

.header-nav a:hover { color: var(--text); }
.header-nav a:hover::after { width: 100%; }
.header-nav a.active { color: var(--primary); }
.header-nav a.active::after { width: 100%; background: var(--primary); }
.nav-videos-group { display: none; align-items: center; gap: 30px; }
.nav-videos-group.visible { display: flex; }

.header-auth {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
}

.lang-switcher { position: relative; }

.lang-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s ease;
}

.lang-btn:hover { border-color: rgba(255,255,255,0.25); }
.lang-btn .flag-icon { width: 21px; height: 14px; border-radius: 2px; overflow: hidden; flex-shrink: 0; display: block; }
.lang-btn svg.chev { width: 12px; height: 12px; stroke: var(--text-dim); }

.lang-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #14141c;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-width: 170px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 500;
}

.lang-dropdown.open { display: flex; }

.lang-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    background: none;
    border: none;
    font-family: inherit;
    text-align: left;
    width: 100%;
}

.lang-option:hover { background: rgba(255,255,255,0.06); }
.lang-option.active { color: var(--primary); }
.lang-option .flag-icon { width: 22px; height: 15px; border-radius: 2px; overflow: hidden; flex-shrink: 0; }

.auth-btn {
    position: relative;
    overflow: hidden;
    background: var(--primary);
    color: #fff;
    border: 1px solid transparent;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
}

.auth-btn.logged-in {
    background: transparent;
    border-color: rgba(255,255,255,0.3);
    color: #fff;
}

.auth-btn.logged-in:hover { border-color: rgba(255,255,255,0.6); }

.user-menu { position: relative; display: inline-block; }

.user-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
    display: none;
}

.user-avatar.has-menu { cursor: pointer; }

.user-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #14141c;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    min-width: 170px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 500;
}

.user-dropdown.open { display: flex; }

.user-dropdown-item {
    display: flex;
    align-items: center;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
}

.user-dropdown-item:hover { background: rgba(255,255,255,0.06); }

.mc-hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 150px 24px 30px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.mc-hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
}

.mc-hero-clip {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.8s ease;
    animation: mcClipMove 10s ease-in-out infinite;
}

.mc-hero-clip.active { opacity: 1; }

@keyframes mcClipMove {
    0% { transform: scale(1.08) translate3d(0, 0, 0); }
    50% { transform: scale(1.17) translate3d(0, -2%, 0); }
    100% { transform: scale(1.08) translate3d(0, 0, 0); }
}

.mc-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(10,10,15,0.78) 0%, rgba(10,10,15,0.5) 38%, rgba(10,10,15,0.6) 70%, #0a0a0f 100%);
}

.mc-hero-content {
    position: relative;
    z-index: 2;
    max-width: 1150px;
    margin: 0 auto;
    padding: 0 24px;
}

.mc-title-wrap {
    position: relative;
    display: block;
    width: 100%;
    text-align: center;
    margin-bottom: 10px;
}

.mc-title {
    position: relative;
    z-index: 1;
    display: inline-block;
    font-family: 'Manrope', sans-serif;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
}

.mc-title-white { color: #ffffff; }
.mc-title-orange { color: var(--primary); }

.mc-description {
    font-size: 20px;
    font-weight: 600;
    color: #f0f0f3;
    line-height: 1.55;
    max-width: 640px;
    margin: 0 auto 16px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
    min-height: 3.1em;
}

.mc-highlight {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(56,189,248,0.65), 0 2px 10px rgba(0,0,0,0.7);
    max-width: 640px;
    line-height: 1.55;
    margin: 0 auto 24px;
    min-height: 1.55em;
}

.mc-cursor {
    display: inline-block;
    margin-left: 2px;
    color: var(--accent);
    animation: mcBlink 1s step-end infinite;
}

@keyframes mcBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.results-btn {
    position: relative;
    overflow: hidden;
    display: inline-block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 15px 48px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    transition: border-color 0.2s ease, transform 0.2s ease;
}

.results-btn:hover {
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
}

.results-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 45%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.results-btn:hover::before { left: 125%; }

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 8, 0.72);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.modal-overlay.open {
    display: flex;
}

.modal-box {
    background: #14141c;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    max-width: 460px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalPopIn 0.22s ease;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
}

.modal-box::-webkit-scrollbar {
    width: 6px;
}

.modal-box::-webkit-scrollbar-track {
    background: transparent;
}

.modal-box::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 10px;
}

.modal-box::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
}

@keyframes modalPopIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
    position: relative;
    overflow: hidden;
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid #ef4444;
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
}

.modal-close::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 45%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.modal-close:hover::before { left: 125%; }

.modal-close:hover {
    color: var(--text);
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.12);
}

.modal-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 20px;
    padding-right: 24px;
    line-height: 1.4;
}

.modal-title a {
    color: var(--text);
    text-decoration: none;
}

.modal-title a:hover {
    text-decoration: underline;
}

.result-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.result-detail-row:last-child {
    border-bottom: none;
}

.result-detail-label {
    color: var(--text-dim);
    flex-shrink: 0;
}

.result-detail-value {
    color: var(--text);
    font-weight: 700;
    text-align: right;
}

.result-detail-value a {
    color: var(--accent);
    text-decoration: none;
}

.result-detail-value a:hover {
    text-decoration: underline;
}

.more-year-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.more-year-btn {
    position: relative;
    overflow: hidden;
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 0;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}

.more-year-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 45%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.more-year-btn:hover::before { left: 125%; }

.more-year-btn.active {
    color: var(--text);
    border-color: var(--primary);
    background: rgba(230, 126, 34, 0.14);
}

.more-results-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.more-result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.2s ease;
}

.more-result-row:hover {
    border-color: rgba(255, 255, 255, 0.25);
}

.more-result-row:hover .more-result-link-icon {
    color: var(--primary);
}

.more-result-name {
    display: flex;
    align-items: center;
    gap: 8px;
}

.more-result-link-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    color: var(--text-dim);
}

.more-result-prize {
    color: var(--primary);
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
}

.modal-box-wide {
    max-width: 640px;
    max-height: 62vh;
}

.mc-cta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 28px;
}

.mc-tiers-section {
    padding: 10px 24px 110px;
}

.mc-tiers-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: stretch;
    gap: 56px;
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
}

.mc-tier-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px 22px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.mc-tier-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.mc-tier-card.in-view { opacity: 1; transform: translateY(0); }

.mc-tier-card:hover { border-color: rgba(255,255,255,0.25); }
.mc-tier-card[data-plan] { cursor: pointer; }

.plan-modal-box {
    max-width: 430px;
    padding: 30px 28px 26px;
    background: linear-gradient(180deg, #1a1a22 0%, #14141a 100%);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 80px rgba(230, 126, 34, 0.12);
}

.plan-chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(230, 126, 34, 0.12);
    border: 1px solid rgba(230, 126, 34, 0.35);
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.3px;
}

.plan-modal-title {
    font-size: 22px;
    font-weight: 900;
    margin: 14px 0 6px;
}

.plan-modal-sub {
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.55;
    margin-bottom: 22px;
}

.plan-field-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-dim);
    margin-bottom: 8px;
}

.plan-input-wrap { position: relative; }

.plan-input-wrap input {
    width: 100%;
    padding: 13px 44px 13px 15px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.plan-input-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); }
.plan-input-wrap.valid input { border-color: rgba(52, 211, 153, 0.6); box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.08); }
.plan-input-wrap.invalid input { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08); }

.plan-input-status {
    position: absolute;
    right: 13px;
    top: 50%;
    margin-top: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
}

.plan-input-status svg { width: 12px; height: 12px; }
.plan-input-wrap.valid .plan-input-status { display: flex; background: #34d399; }
.plan-input-wrap.invalid .plan-input-status { display: flex; background: #ef4444; }

.plan-input-wrap.checking .plan-input-status {
    display: block;
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--primary);
    animation: planSpin 0.7s linear infinite;
}

@keyframes planSpin { to { transform: rotate(360deg); } }

.plan-field-hint {
    min-height: 18px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 7px;
    color: var(--text-dim);
}

.plan-field-hint.valid { color: #34d399; }
.plan-field-hint.invalid { color: #f87171; }

.plan-check-row {
    position: relative;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin: 14px 0 22px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s ease;
}

.plan-check-row:hover { border-color: rgba(255, 255, 255, 0.18); }
.plan-check-row input { position: absolute; opacity: 0; pointer-events: none; }

.plan-checkbox {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: background 0.15s ease, border-color 0.15s ease;
}

.plan-checkbox svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s ease; }
.plan-check-row input:checked + .plan-checkbox { background: var(--primary); border-color: var(--primary); }
.plan-check-row input:checked + .plan-checkbox svg { opacity: 1; }
.plan-check-row input:focus-visible + .plan-checkbox { box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.35); }

.plan-check-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
}

.plan-check-text a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid rgba(230, 126, 34, 0.4);
}

.plan-check-text a:hover { border-bottom-color: var(--primary); }

.plan-create-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #E67E22, #c96a14);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(230, 126, 34, 0.3);
    transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}

.plan-create-btn:hover:not(:disabled) { transform: translateY(-1px); }
.plan-create-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

.plan-form-error {
    min-height: 16px;
    margin-top: 10px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: #f87171;
}

.plan-existing {
    margin-top: 14px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

.plan-existing.hidden { display: none; }

.plan-existing-title {
    font-size: 11px;
    font-weight: 800;

    function typewriterStart(mainText, highlightText) {
        if (typeTimer) clearInterval(typeTimer);
        mcDescMain.textContent = '';
        mcDescHighlight.textContent = '';
        mcCursorMain.style.display = 'inline-block';
        mcCursorHighlight.style.display = 'none';
        var i = 0;
        typeTimer = setInterval(function() {
            if (i < mainText.length) {
                mcDescMain.textContent += mainText.charAt(i);
            } else {
                if (mcCursorMain.style.display !== 'none') {
                    mcCursorMain.style.display = 'none';
                    mcCursorHighlight.style.display = 'inline-block';
                }
                mcDescHighlight.textContent += highlightText.charAt(i - mainText.length);
            }
            i++;
            if (i >= mainText.length + highlightText.length) {
                clearInterval(typeTimer);
            }
        }, 7);
    }

    function renderLangUI() {
        langBtnFlag.innerHTML = FLAGS[currentLang];
        langDropdown.innerHTML = LANGS.map(function(l) {
            return '<button class="lang-option' + (l.code === currentLang ? ' active' : '') + '" data-code="' + l.code + '">' +

        }).join('');
    }

    function applyStaticTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(function(el) {

        mcTiersGrid.innerHTML = TIERS.map(function(t) {

                return '<div class="mc-tier-card custom" data-plan="' + t.key + '">' +

            var featuresHtml = t.features.map(function(fKey) {

                return '<li><span class="mc-feat-dot">•</span><span class="mc-feat-text">' + text + '</span></li>';
            }).join('');
            var ribbonHtml = t.recommended ? '<div class="mc-tier-ribbon">' + I18N[currentLang].mc_recommended_badge.replace('{n}', recommendedCount) + '</div>' : '';

            '</div>';
        }).join('');
        setupTiersReveal();

    var tiersRevealObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
            } else {
                entry.target.classList.remove('in-view');
            }
        });
    }, { threshold: 0.15 }) : null;

    function setupTiersReveal() {
        var cards = mcTiersGrid.querySelectorAll('.mc-tier-card');
        if (!tiersRevealObserver) {
            cards.forEach(function(card) { card.classList.add('in-view'); });
            return;
        }
        cards.forEach(function(card) { tiersRevealObserver.observe(card); });
    }

    var planState = { key: null, emailValid: false, checkTimer: null, checkSeq: 0 };
    var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
    var CROSS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    function planText(key) {
        return I18N[currentLang]['plan_' + key] || I18N.en['plan_' + key] || '';
    }

    function planChipText(tier) {
        var name = I18N[currentLang][tier.nameKey];
        return tier.price ? name + ' · ' + tier.price + ' ' + I18N[currentLang].mc_month : name;
    }

    function closePlanModal() {
        if (planModal) planModal.classList.remove('open');
        clearTimeout(planState.checkTimer);
        planState.checkSeq++;
        planState.key = null;
    }

    function updateCreateBtn() {
        var btn = document.getElementById('planCreateBtn');
        var terms = document.getElementById('planTermsInput');
        if (!btn || !terms) return;
        btn.disabled = !(planState.emailValid && terms.checked);
    }

    function setEmailState(state, message) {
        var wrap = document.getElementById('planEmailWrap');
        var hint = document.getElementById('planEmailHint');
        var status = document.getElementById('planEmailStatus');
        if (!wrap || !hint || !status) return;
        wrap.classList.remove('valid', 'invalid', 'checking');
        hint.classList.remove('valid', 'invalid');
        status.innerHTML = '';
        if (state === 'valid') { wrap.classList.add('valid'); hint.classList.add('valid'); status.innerHTML = CHECK_SVG; }
        if (state === 'invalid') { wrap.classList.add('invalid'); hint.classList.add('invalid'); status.innerHTML = CROSS_SVG; }
        if (state === 'checking') wrap.classList.add('checking');
        hint.textContent = message || '';
        planState.emailValid = state === 'valid';
        updateCreateBtn();
    }

    function runEmailCheck() {
        var input = document.getElementById('planEmailInput');
        if (!input) return;
        var value = input.value.trim();
        if (!value) { setEmailState('idle', ''); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) { setEmailState('invalid', planText('invalid_format')); return; }
        var seq = ++planState.checkSeq;
        setEmailState('checking', planText('checking'));
        fetch('/api/site/mc-tickets/check-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: value })
        }).then(function(res) { return res.json(); }).then(function(data) {
            if (seq !== planState.checkSeq) return;
            if (data.valid) setEmailState('valid', planText('valid'));
            else setEmailState('invalid', data.reason === 'domain_no_mail' ? planText('no_mail') : planText('invalid_format'));
        }).catch(function() {
            if (seq !== planState.checkSeq) return;
            setEmailState('invalid', planText('error'));
        });
    }

    function renderPlanSignIn(tier) {
        planModalContent.innerHTML =
            '<span class="plan-chip">' + planChipText(tier) + '</span>' +
            '<h3 class="plan-modal-title">' + planText('title') + '</h3>' +
            '<p class="plan-modal-sub">' + planText('signin_text') + '</p>' +
            '<button type="button" class="plan-signin-btn" id="planSignInBtn">' + planText('signin_btn') + '</button>';
        document.getElementById('planSignInBtn').addEventListener('click', function() {
            window.location.href = '/site-auth/discord?next=' + encodeURIComponent('/masterclass');
        });
    }

    function renderPlanForm(tier) {
        var termsHtml = planText('terms')
            .replace('{tos}', '<a href="/terms" target="_blank" rel="noopener">' + I18N[currentLang].footer_terms + '</a>')
            .replace('{privacy}', '<a href="/privacy" target="_blank" rel="noopener">' + I18N[currentLang].footer_privacy + '</a>');
        planModalContent.innerHTML =
            '<span class="plan-chip">' + planChipText(tier) + '</span>' +
            '<h3 class="plan-modal-title">' + planText('title') + '</h3>' +
            '<p class="plan-modal-sub">' + planText('sub') + '</p>' +
            '<label class="plan-field-label" for="planEmailInput">' + planText('email_label') + '</label>' +
            '<div class="plan-input-wrap" id="planEmailWrap">' +
                '<input type="email" id="planEmailInput" placeholder="you@example.com" autocomplete="email" maxlength="254">' +
                '<span class="plan-input-status" id="planEmailStatus"></span>' +
            '</div>' +
            '<p class="plan-field-hint" id="planEmailHint"></p>' +
            '<label class="plan-check-row" id="planTermsRow">' +
                '<input type="checkbox" id="planTermsInput">' +
                '<span class="plan-checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>' +
                '<span class="plan-check-text">' + termsHtml + '</span>' +
            '</label>' +
            '<button type="button" class="plan-create-btn" id="planCreateBtn" disabled>' + planText('create') + '</button>' +
            '<p class="plan-form-error" id="planFormError"></p>' +
            '<div class="plan-existing hidden" id="planExisting"></div>';

        var input = document.getElementById('planEmailInput');
        var terms = document.getElementById('planTermsInput');
        var createBtn = document.getElementById('planCreateBtn');

        input.addEventListener('input', function() {
            clearTimeout(planState.checkTimer);
            planState.checkSeq++;
            setEmailState('idle', '');
            planState.checkTimer = setTimeout(runEmailCheck, 650);
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(planState.checkTimer);
                if (!planState.emailValid) runEmailCheck();
            }
        });

        terms.addEventListener('change', updateCreateBtn);

        planModalContent.querySelectorAll('.plan-check-text a').forEach(function(a) {
            a.addEventListener('click', function(e) { e.stopPropagation(); });
        });

        createBtn.addEventListener('click', function() {
            if (createBtn.disabled) return;
            var errorEl = document.getElementById('planFormError');
            errorEl.textContent = '';
            createBtn.disabled = true;
            createBtn.textContent = planText('creating');
            fetch('/api/site/mc-tickets/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: input.value.trim(), planKey: tier.key, acceptTerms: terms.checked })
            }).then(function(res) {
                return res.json().then(function(body) { return { ok: res.ok, status: res.status, body: body || {} }; });
            }).then(function(r) {
                if (r.ok && r.body.ticketNumber) {
                    window.location.href = '/ticket/' + r.body.ticketNumber;
                    return;
                }
                if (r.status === 401) {
                    renderPlanSignIn(tier);
                    return;
                }
                if (r.body.error === 'domain_no_mail' || r.body.error === 'invalid_format') {
                    setEmailState('invalid', r.body.error === 'domain_no_mail' ? planText('no_mail') : planText('invalid_format'));
                } else {
                    errorEl.textContent = (r.status === 429 && r.body.error) ? r.body.error : planText('error');
                }
                createBtn.textContent = planText('create');
                updateCreateBtn();
            }).catch(function() {
                errorEl.textContent = planText('error');
                createBtn.textContent = planText('create');
                updateCreateBtn();
            });
        });

        fetch('/api/site/mc-tickets/mine').then(function(res) { return res.ok ? res.json() : null; }).then(function(data) {
            var box = document.getElementById('planExisting');
            if (!box || !data || !Array.isArray(data.tickets)) return;
            var open = data.tickets.filter(function(t) { return t.status === 'open'; });
            if (!open.length) return;
            box.innerHTML = '<div class="plan-existing-title">' + planText('your_tickets') + '</div>' +
                open.map(function(t) {
                    return '<a href="/ticket/' + t.ticketNumber + '"><span>#' + String(t.ticketNumber).padStart(4, '0') + ' · ' + String(t.plan || '').replace(/</g, '&lt;') + '</span><span>' + planText('open_label') + ' →</span></a>';
                }).join('');
            box.classList.remove('hidden');
        }).catch(function() {});

        setTimeout(function() { input.focus(); }, 80);
    }

        var tier = TIERS.filter(function(t) { return t.key === planKey; })[0];

            setTimeout(function() { window.location.href = href; }, 200);
        });
    });

    window.addEventListener('pageshow', function() {
        document.body.classList.remove('page-fade-out');
    });
})();
</script>
</body>
</html>
