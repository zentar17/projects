<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predage - Ticket</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary: #E67E22;
    --primary-dark: #c96a14;
    --accent: #38BDF8;
    --bg-dark: #0a0a0f;
    --bg-card: rgba(24, 24, 32, 0.85);
    --bg-bar: #101016;
    --panel: rgba(16, 16, 22, 0.92);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8e8ed;
    --text-dim: #a3a3ad;
    --green: #34d399;
    --red: #ef4444;
}

html, body { height: 100%; }

body {
    background: radial-gradient(circle at 20% -10%, rgba(230, 126, 34, 0.08), transparent 45%), var(--bg-dark);
    color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 28px;
    background: var(--bg-bar);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 18px;
    font-weight: 800;
}

.brand img { width: 32px; height: 32px; }

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    transition: color 0.2s ease, border-color 0.2s ease;
}

.back-link:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.25); }
.back-link svg { width: 15px; height: 15px; }

.ticket-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
}

.state-box {
    margin: auto;
    text-align: center;
    max-width: 420px;
    padding: 40px 24px;
}

.state-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
.state-box p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin-bottom: 22px; }

.state-box a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
}

.ticket-layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
}

.ticket-card {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}

.chat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    flex-shrink: 0;
}

.chat-top-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.ticket-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(230, 126, 34, 0.14);
    border: 1px solid rgba(230, 126, 34, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
}

.ticket-icon svg { width: 20px; height: 20px; }

.chat-title {
    font-size: 16px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(52, 211, 153, 0.12);
    color: var(--green);
    flex-shrink: 0;
}

.status-badge::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
}

.status-badge.closed { background: rgba(239, 68, 68, 0.12); color: #f87171; }
.status-badge.transcript { background: rgba(56, 189, 248, 0.12); color: var(--accent); }

.chat-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
}

.sys-msg {
    align-self: center;
    max-width: 520px;
    text-align: center;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed rgba(255, 255, 255, 0.1);
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.6;
}

.sys-msg b { color: var(--text); }

.event-msg {
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(230, 126, 34, 0.08);
    border: 1px solid rgba(230, 126, 34, 0.2);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    max-width: 90%;
    text-align: center;
}

.event-msg b { color: var(--text); font-weight: 700; }
.event-msg .event-time { font-size: 11px; opacity: 0.8; }

.day-sep {
    align-self: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.msg {
    display: flex;
    gap: 10px;
    max-width: 72%;
    animation: msgIn 0.25s ease;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.msg.me {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: #1e1e28;
}

.msg-content { min-width: 0; }

.msg-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
}

.msg.me .msg-head { justify-content: flex-end; }

.msg-name { font-size: 13px; font-weight: 800; }

.staff-tag {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(230, 126, 34, 0.16);
    color: var(--primary);
}

.msg-time { font-size: 11px; color: var(--text-dim); }

.bubble {
    padding: 11px 15px;
    border-radius: 16px;
    border-top-left-radius: 5px;
    font-size: 14px;
    line-height: 1.55;
    background: #16161e;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
}

.msg.staff .bubble { border-color: rgba(230, 126, 34, 0.18); }

.msg.me .bubble {
    background: linear-gradient(135deg, rgba(230, 126, 34, 0.22), rgba(230, 126, 34, 0.12));
    border-color: rgba(230, 126, 34, 0.35);
    border-top-left-radius: 16px;
    border-top-right-radius: 5px;
}

.chat-banner {
    margin: 0 18px 16px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    flex-shrink: 0;
}

.chat-banner.closed {
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #f87171;
}

.chat-banner.locked {
    background: rgba(230, 126, 34, 0.08);
    border: 1px solid rgba(230, 126, 34, 0.25);
    color: var(--primary);
}

.chat-banner.transcript {
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.25);
    color: var(--accent);
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 16px 18px 6px;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    flex-shrink: 0;
}

.composer textarea {
    flex: 1;
    resize: none;
    height: 46px;
    min-height: 46px;
    max-height: 160px;
    padding: 13px 15px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.composer textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
}

.composer textarea::placeholder { color: var(--text-dim); }

.btn-send {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, opacity 0.2s ease;
}

.btn-send:hover { transform: translateY(-1px); }
.btn-send:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn-send svg { width: 19px; height: 19px; }

.composer-hint {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 20px 12px;
    background: rgba(255, 255, 255, 0.02);
    flex-shrink: 0;
}

.composer-error { color: #f87171; font-weight: 700; }

.ticket-side {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
}

.side-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
}

.side-title {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 14px;
}

.side-user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
}

.side-user img {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: #1e1e28;
    flex-shrink: 0;
}

.side-user-name {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.side-user-id {
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 3px;
}

.side-rows {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.side-row-label {
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin-bottom: 4px;
}

.side-row-value {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 600;
    word-break: break-word;
}

.side-row-value.plan { color: var(--primary); font-weight: 800; }
.side-row-value .muted { color: var(--text-dim); font-weight: 500; }

.copy-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
}

.copy-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.25); }
.copy-btn.copied { color: var(--green); border-color: rgba(52, 211, 153, 0.5); }
.copy-btn svg { width: 14px; height: 14px; }

.claim-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dim);
}

.claim-chip.claimed { background: rgba(230, 126, 34, 0.14); color: var(--primary); }

.side-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.side-btn {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
}

.side-btn svg { width: 16px; height: 16px; }
.side-btn:disabled { opacity: 0.5; cursor: default; }

.side-btn.claim {
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 8px 24px rgba(230, 126, 34, 0.25);
}

.side-btn.claim:hover:not(:disabled) { transform: translateY(-1px); }

.side-btn.ghost {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text);
}

.side-btn.ghost:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.25); }

.side-btn.close {
    border: 1px solid rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.08);
    color: #f87171;
}

.side-btn.close:hover:not(:disabled) { background: rgba(239, 68, 68, 0.16); }

.side-btn.reopen {
    border: 1px solid rgba(52, 211, 153, 0.4);
    background: rgba(52, 211, 153, 0.08);
    color: var(--green);
}

.side-btn.reopen:hover:not(:disabled) { background: rgba(52, 211, 153, 0.16); }

.side-note {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
}

.side-error {
    font-size: 12px;
    font-weight: 700;
    color: #f87171;
    min-height: 0;
}

.loading-dots { display: inline-flex; gap: 5px; }

.loading-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 1.2s infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
}

.hidden { display: none !important; }

@media (max-width: 980px) {
    body { overflow: auto; height: auto; }
    html { height: auto; }
    .ticket-wrap { flex: none; }
    .ticket-layout { grid-template-columns: 1fr; }
    .ticket-card { height: 78vh; min-height: 480px; }
    .ticket-side { overflow: visible; }
}

@media (max-width: 700px) {
    .top-bar { padding: 14px 16px; }
    .ticket-wrap { padding: 12px 10px; }
    .chat-top { padding: 16px; }
    .msg { max-width: 90%; }
    .chat-body { padding: 16px; }
}
</style>
</head>
<body>

<div class="top-bar">
    <a class="brand" href="/">
        <img src="/images/dragon-logo.png" alt="Predage">
        <span>Predage</span>
    </a>
    <a class="back-link" href="/masterclass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Masterclass
    </a>
</div>

<div class="ticket-wrap">
    <div class="state-box" id="stateBox">
        <span class="loading-dots"><span></span><span></span><span></span></span>
    </div>

    <div class="ticket-layout hidden" id="ticketLayout">
        <div class="ticket-card">
            <div class="chat-top">
                <div class="chat-top-left">
                    <div class="ticket-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg></div>
                    <div style="min-width: 0;">
                        <div class="chat-title" id="chatTitle"></div>
                        <div class="chat-meta" id="chatMeta"></div>
                    </div>
                </div>
                <span class="status-badge" id="statusBadge">Open</span>
            </div>

            <div class="chat-body" id="chatBody"></div>

            <div class="chat-banner hidden" id="chatBanner"></div>

            <div class="composer hidden" id="composer">
                <textarea id="messageInput" placeholder="Write a message…" maxlength="2000" rows="1"></textarea>
                <button type="button" class="btn-send" id="sendBtn" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
                </button>
            </div>
            <div class="composer-hint hidden" id="composerHint">
                <span class="composer-error" id="composerError"></span>
                <span>Enter to send · Shift + Enter for a new line</span>
            </div>
        </div>

        <aside class="ticket-side">
            <div class="side-card">
                <div class="side-title">Ticket Info</div>
                <div class="side-user">
                    <img id="sideAvatar" alt="" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                    <div style="min-width: 0;">
                        <div class="side-user-name" id="sideUserName"></div>
                        <div class="side-user-id" id="sideUserId"></div>
                    </div>
                </div>
                <div class="side-rows">
                    <div>
                        <div class="side-row-label">Email</div>
                        <div class="side-row-value"><span id="sideEmail"></span><button type="button" class="copy-btn" id="copyEmailBtn" title="Copy email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
                    </div>
                    <div>
                        <div class="side-row-label">Plan</div>
                        <div class="side-row-value plan" id="sidePlan"></div>
                    </div>
                    <div>
                        <div class="side-row-label">Price</div>
                        <div class="side-row-value" id="sidePrice"></div>
                    </div>
                    <div>
                        <div class="side-row-label">Opened</div>
                        <div class="side-row-value" id="sideOpened"></div>
                    </div>
                    <div>
                        <div class="side-row-label">Claimed by</div>
                        <div class="side-row-value" id="sideClaim"></div>
                    </div>
                    <div class="hidden" id="sideDeleteRow">
                        <div class="side-row-label" id="sideDeleteLabel">Deletion</div>
                        <div class="side-row-value" id="sideDelete"></div>
                    </div>
                </div>
            </div>

            <div class="side-card hidden" id="staffCard">
                <div class="side-title">Staff Actions</div>
                <div class="side-actions">
                    <button type="button" class="side-btn claim" id="claimBtn"></button>
                    <button type="button" class="side-btn close" id="statusBtn"></button>
                    <p class="side-note" id="staffNote"></p>
                    <p class="side-error" id="staffError"></p>
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
(function() {
    var match = window.location.pathname.match(/\/ticket\/(\d+)/);
    var ticketNumber = match ? match[1] : null;

    var stateBox = document.getElementById('stateBox');
    var layout = document.getElementById('ticketLayout');
    var chatTitle = document.getElementById('chatTitle');
    var chatMeta = document.getElementById('chatMeta');
    var statusBadge = document.getElementById('statusBadge');
    var chatBody = document.getElementById('chatBody');
    var chatBanner = document.getElementById('chatBanner');
    var composer = document.getElementById('composer');
    var composerHint = document.getElementById('composerHint');
    var composerError = document.getElementById('composerError');
    var messageInput = document.getElementById('messageInput');
    var sendBtn = document.getElementById('sendBtn');
    var sideAvatar = document.getElementById('sideAvatar');
    var sideUserName = document.getElementById('sideUserName');
    var sideUserId = document.getElementById('sideUserId');
    var sideEmail = document.getElementById('sideEmail');
    var copyEmailBtn = document.getElementById('copyEmailBtn');
    var sidePlan = document.getElementById('sidePlan');
    var sidePrice = document.getElementById('sidePrice');
    var sideOpened = document.getElementById('sideOpened');
    var sideClaim = document.getElementById('sideClaim');
    var sideDeleteRow = document.getElementById('sideDeleteRow');
    var sideDeleteLabel = document.getElementById('sideDeleteLabel');
    var sideDelete = document.getElementById('sideDelete');
    var staffCard = document.getElementById('staffCard');
    var claimBtn = document.getElementById('claimBtn');
    var statusBtn = document.getElementById('statusBtn');
    var staffNote = document.getElementById('staffNote');
    var staffError = document.getElementById('staffError');

    var ticket = null;
    var viewer = null;
    var messageCount = 0;
    var lastDayKey = null;
    var pollTimer = null;
    var polling = false;
    var sending = false;

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function dayKey(date) {
        var d = new Date(date);
        return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    }

    function dayLabel(date) {
        var d = new Date(date);
        var now = new Date();
        var yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
        if (dayKey(d) === dayKey(now)) return 'Today';
        if (dayKey(d) === dayKey(yesterday)) return 'Yesterday';
        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
    }

    function timeLabel(date) {
        return new Date(date).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function fullDate(date) {
        if (!date) return '—';
        return new Date(date).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function countdown(date) {
        var diff = new Date(date).getTime() - Date.now();
        if (diff <= 0) return 'any moment now';
        var h = Math.floor(diff / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        return 'in ' + (h > 0 ? h + 'h ' : '') + m + 'm';
    }

    function showState(title, text) {
        layout.classList.add('hidden');
        stateBox.classList.remove('hidden');
        stateBox.innerHTML = '<h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(text) + '</p><a href="/masterclass">Back to Masterclass</a>';
    }

    function isNearBottom() {
        return chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight < 120;
    }

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setBanner(type, text) {
        if (!type) {
            chatBanner.className = 'chat-banner hidden';
            chatBanner.textContent = '';
            return;
        }
        chatBanner.className = 'chat-banner ' + type;
        chatBanner.textContent = text;
    }

    function renderHeader() {
        var priceText = ticket.price ? ' · ' + ticket.price + ' / month' : '';
        chatTitle.textContent = 'Ticket #' + String(ticket.ticketNumber).padStart(4, '0') + ' · ' + ticket.plan + priceText;
        chatMeta.textContent = 'Opened ' + fullDate(ticket.createdAt);

        statusBadge.className = 'status-badge';
        if (ticket.isTranscript) {
            statusBadge.textContent = 'Transcript';
            statusBadge.classList.add('transcript');
        } else if (ticket.status === 'open') {
            statusBadge.textContent = 'Open';
        } else {
            statusBadge.textContent = 'Closed';
            statusBadge.classList.add('closed');
        }

        var canWrite = viewer && viewer.canWrite;
        composer.classList.toggle('hidden', !canWrite);
        composerHint.classList.toggle('hidden', !canWrite);

        if (ticket.isTranscript) {
            setBanner('transcript', 'Transcript · this ticket was deleted ' + (ticket.deletedAt ? 'on ' + fullDate(ticket.deletedAt) : '') + '. Only staff can see it.');
        } else if (ticket.status !== 'open') {
            setBanner('closed', 'This ticket was closed' + (ticket.closedByName ? ' by ' + ticket.closedByName : '') + ' and will be deleted ' + (ticket.deleteAt ? countdown(ticket.deleteAt) : 'in 24 hours') + '.');
        } else if (!canWrite && viewer && viewer.isStaff) {
            setBanner('locked', 'Claimed by ' + (ticket.claimedByName || 'another staff member') + ' · only they can reply.');
        } else {
            setBanner(null);
        }
    }

    function renderSide() {
        sideAvatar.src = ticket.userAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
        sideUserName.textContent = ticket.userName || 'Unknown';
        sideUserId.textContent = 'ID ' + (ticket.userId || '—');
        sideEmail.textContent = ticket.email || '—';
        sidePlan.textContent = ticket.plan || '—';
        sidePrice.innerHTML = ticket.price ? '<span>' + escapeHtml(ticket.price) + ' <span class="muted">/ month</span></span>' : '<span class="muted">To be agreed</span>';
        sideOpened.textContent = fullDate(ticket.createdAt);
        sideClaim.innerHTML = ticket.claimedByName
            ? '<span class="claim-chip claimed">' + escapeHtml(ticket.claimedByName) + '</span>'
            : '<span class="claim-chip">Not claimed</span>';

        if (ticket.isTranscript) {
            sideDeleteRow.classList.remove('hidden');
            sideDeleteLabel.textContent = 'Closed';
            sideDelete.textContent = fullDate(ticket.closedAt);
        } else if (ticket.status !== 'open' && ticket.deleteAt) {
            sideDeleteRow.classList.remove('hidden');
            sideDeleteLabel.textContent = 'Auto-delete';
            sideDelete.textContent = countdown(ticket.deleteAt);
        } else {
            sideDeleteRow.classList.add('hidden');
        }

        var showStaff = viewer && viewer.isStaff && !ticket.isTranscript;
        staffCard.classList.toggle('hidden', !showStaff);
        if (!showStaff) return;

        var isOpen = ticket.status === 'open';
        var mine = ticket.claimedById && ticket.claimedById === viewer.id;
        var other = ticket.claimedById && ticket.claimedById !== viewer.id;

        claimBtn.classList.toggle('hidden', !isOpen);
        if (mine) {
            claimBtn.className = 'side-btn ghost';
            claimBtn.textContent = 'Unclaim Ticket';
            claimBtn.dataset.action = 'unclaim';
            claimBtn.disabled = false;
        } else if (other) {
            claimBtn.className = 'side-btn ghost';
            claimBtn.textContent = viewer.isSuperOwner ? 'Take Over Ticket' : 'Claimed by ' + ticket.claimedByName;
            claimBtn.dataset.action = 'claim';
            claimBtn.disabled = !viewer.isSuperOwner;
        } else {
            claimBtn.className = 'side-btn claim';
            claimBtn.textContent = 'Claim Ticket';
            claimBtn.dataset.action = 'claim';
            claimBtn.disabled = false;
        }
        if (!isOpen) claimBtn.classList.add('hidden');

        statusBtn.className = 'side-btn ' + (isOpen ? 'close' : 'reopen');
        statusBtn.textContent = isOpen ? 'Close Ticket' : 'Reopen Ticket';

        if (!isOpen) staffNote.textContent = 'Closed tickets are deleted 24 hours after closing. The transcript and logs are kept.';
        else if (!ticket.claimedById) staffNote.textContent = 'Claim the ticket to let the user know you are handling it. Once claimed, only you can reply.';
        else if (mine) staffNote.textContent = 'You are handling this ticket.';
        else staffNote.textContent = 'Another staff member is handling this ticket.';
    }

    function renderIntro() {
        var priceText = ticket.price ? ' (' + escapeHtml(ticket.price) + ' / month)' : '';
        var intro = document.createElement('div');
        intro.className = 'sys-msg';
        intro.innerHTML = 'Ticket created for <b>' + escapeHtml(ticket.plan) + priceText + '</b>.<br>A member of the Masterclass team will reply here soon.';
        chatBody.appendChild(intro);
        lastDayKey = null;
        if (ticket.createdAt) appendDaySeparator(ticket.createdAt);
    }

    function appendDaySeparator(date) {
        var key = dayKey(date);
        if (key === lastDayKey) return;
        lastDayKey = key;
        var sep = document.createElement('span');
        sep.className = 'day-sep';
        sep.textContent = dayLabel(date);
        chatBody.appendChild(sep);
    }

    function appendMessage(m) {
        appendDaySeparator(m.date);
        if (m.system) {
            var ev = document.createElement('div');
            ev.className = 'event-msg';
            ev.innerHTML = '<span>' + escapeHtml(m.content) + '</span><span class="event-time">' + timeLabel(m.date) + '</span>';
            chatBody.appendChild(ev);
            return;
        }
        var mine = viewer && m.authorId === viewer.id;
        var el = document.createElement('div');
        el.className = 'msg' + (mine ? ' me' : '') + (m.isStaff ? ' staff' : '');
        var avatar = m.authorAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
        var name = '<span class="msg-name">' + escapeHtml(m.authorName || 'User') + '</span>';
        var tag = m.isStaff ? '<span class="staff-tag">Staff</span>' : '';
        var time = '<span class="msg-time">' + timeLabel(m.date) + '</span>';
        var head = mine ? (time + tag + name) : (name + tag + time);
        el.innerHTML = '<img class="msg-avatar" src="' + escapeHtml(avatar) + '" alt="" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' +
            '<div class="msg-content"><div class="msg-head">' + head + '</div><div class="bubble"></div></div>';
        el.querySelector('.bubble').textContent = m.content;
        chatBody.appendChild(el);
    }

    function load(initial) {
        if (polling) return Promise.resolve();
        polling = true;
        var url = '/api/site/mc-tickets/' + ticketNumber + '?since=' + (initial ? 0 : messageCount);
        return fetch(url, { cache: 'no-store' }).then(function(res) {
            if (res.status === 401) {
                window.location.href = '/site-auth/discord?next=' + encodeURIComponent('/ticket/' + ticketNumber);
                return null;
            }
            if (res.status === 404) {
                showState('Ticket not found', 'This ticket does not exist anymore or you do not have access to it.');
                stopPolling();
                return null;
            }
            if (!res.ok) throw new Error('load_failed');
            return res.json();
        }).then(function(data) {
            if (!data) return;
            var stick = initial || isNearBottom();
            ticket = data.ticket;
            viewer = data.viewer;
            if (initial) {
                stateBox.classList.add('hidden');
                layout.classList.remove('hidden');
                chatBody.innerHTML = '';
                messageCount = 0;
                renderIntro();
            }
            if (data.since === messageCount) {
                ticket.messages.forEach(appendMessage);
                messageCount += ticket.messages.length;
            }
            renderHeader();
            renderSide();
            if (ticket.isTranscript) stopPolling();
            if (stick) scrollToBottom();
        }).catch(function() {
            if (initial) showState('Something went wrong', 'We could not load this ticket. Please try again in a moment.');
        }).then(function() {
            polling = false;
        });
    }

    function startPolling() {
        stopPolling();
        if (ticket && ticket.isTranscript) return;
        pollTimer = setInterval(function() {
            if (document.hidden) return;
            load(false);
        }, 4000);
    }

    function stopPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
    }

    function autoGrow() {
        messageInput.style.height = '46px';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
    }

    var ERRORS = {
        ticket_closed: 'This ticket is closed.',
        message_too_long: 'Message is too long (max 2000 characters).',
        empty_message: 'Write a message first.',
        claimed_by_other: 'This ticket is claimed by another staff member.',
        forbidden: 'You are not allowed to do this.',
        conflict: 'Someone else changed this ticket, please retry.'
    };

    function sendMessage() {
        var content = messageInput.value.trim();
        if (!content || sending || !ticket || !viewer || !viewer.canWrite) return;
        sending = true;
        sendBtn.disabled = true;
        composerError.textContent = '';
        fetch('/api/site/mc-tickets/' + ticketNumber + '/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        }).then(function(res) {
            return res.json().then(function(body) { return { ok: res.ok, body: body || {} }; });
        }).then(function(r) {
            if (!r.ok) {
                composerError.textContent = ERRORS[r.body.error] || r.body.error || 'Could not send the message.';
                return load(false);
            }
            messageInput.value = '';
            autoGrow();
            return load(false).then(scrollToBottom);
        }).catch(function() {
            composerError.textContent = 'Could not send the message.';
        }).then(function() {
            sending = false;
            sendBtn.disabled = false;
            if (!composer.classList.contains('hidden')) messageInput.focus();
        });
    }

    function staffAction(path, payload, button) {
        staffError.textContent = '';
        button.disabled = true;
        return fetch('/api/site/mc-tickets/' + ticketNumber + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(res) {
            return res.json().then(function(body) { return { ok: res.ok, body: body || {} }; });
        }).then(function(r) {
            if (!r.ok) staffError.textContent = ERRORS[r.body.error] || 'Something went wrong.';
            return load(false).then(scrollToBottom);
        }).catch(function() {
            staffError.textContent = 'Something went wrong.';
        }).then(function() {
            button.disabled = false;
            if (ticket) renderSide();
        });
    }

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    messageInput.addEventListener('input', autoGrow);

    claimBtn.addEventListener('click', function() {
        if (!ticket) return;
        staffAction('/claim', { action: claimBtn.dataset.action || 'claim' }, claimBtn);
    });

    statusBtn.addEventListener('click', function() {
        if (!ticket) return;
        staffAction('/status', { status: ticket.status === 'open' ? 'closed' : 'open' }, statusBtn);
    });

    copyEmailBtn.addEventListener('click', function() {
        if (!ticket || !ticket.email || !navigator.clipboard) return;
        navigator.clipboard.writeText(ticket.email).then(function() {
            copyEmailBtn.classList.add('copied');
            setTimeout(function() { copyEmailBtn.classList.remove('copied'); }, 1500);
        }).catch(function() {});
    });

    document.addEventListener('visibilitychange', function() {
        if (!document.hidden && ticket && !ticket.isTranscript) load(false);
    });

    if (!ticketNumber) {
        showState('Ticket not found', 'This ticket does not exist anymore or you do not have access to it.');
        return;
    }

    load(true).then(startPolling);
})();
</script>
</body>
</html>
